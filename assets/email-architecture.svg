<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
  <title id="title">Email architecture: MUA MSA MTA MDA Message Store</title>
  <desc id="desc">Sender MUA submits using SMTP to MSA, which forwards using SMTP to MTA. Email moves between MTAs via SMTP. The receiving MTA hands the email to MDA, then Message Store. Receiver MUA retrieves via POP or IMAP.</desc>
  <rect x="0" y="0" width="1120" height="530" rx="18" fill="#f8fafc"/>
  <text x="560" y="48" font-size="25" font-weight="700" text-anchor="middle" fill="#15283f" font-family="Arial, sans-serif">Internet email architecture</text>
  <text x="560" y="77" font-size="15" text-anchor="middle" fill="#526479" font-family="Arial, sans-serif">Store-and-forward • components are logical roles</text>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#527ca5"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="172" width="160" height="86" rx="13" fill="#deebff" stroke="#4c83b5" stroke-width="2"/>
    <text x="110" y="204" fill="#214b79" font-size="23" font-weight="700">MUA</text><text x="110" y="226" fill="#3b6085" font-size="13">Sender client</text>
    <rect x="253" y="172" width="160" height="86" rx="13" fill="#deebff" stroke="#4c83b5" stroke-width="2"/>
    <text x="333" y="204" fill="#214b79" font-size="23" font-weight="700">MSA</text><text x="333" y="226" fill="#3b6085" font-size="13">Submission</text>
    <rect x="477" y="172" width="160" height="86" rx="13" fill="#dff2e8" stroke="#418e70" stroke-width="2"/>
    <text x="557" y="204" fill="#23654b" font-size="23" font-weight="700">MTA</text><text x="557" y="226" fill="#3d795f" font-size="13">Sending server</text>
    <rect x="699" y="172" width="160" height="86" rx="13" fill="#dff2e8" stroke="#418e70" stroke-width="2"/>
    <text x="779" y="204" fill="#23654b" font-size="23" font-weight="700">MTA</text><text x="779" y="226" fill="#3d795f" font-size="13">Receiving server</text>
    <rect x="922" y="172" width="160" height="86" rx="13" fill="#fff0dc" stroke="#c28a41" stroke-width="2"/>
    <text x="1002" y="204" fill="#85591f" font-size="23" font-weight="700">MDA</text><text x="1002" y="226" fill="#976a32" font-size="13">Local delivery</text>
    <g stroke="#527ca5" stroke-width="3" marker-end="url(#arrow)"><path d="M190 215 H250"/><path d="M413 215 H474"/><path d="M637 215 H696"/><path d="M859 215 H919"/></g>
    <g fill="#526479" font-size="13"><text x="222" y="197">SMTP</text><text x="445" y="197">SMTP</text><text x="667" y="197">SMTP</text><text x="891" y="197">Local</text></g>
    <path d="M1002 258 V311" fill="none" stroke="#527ca5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="922" y="315" width="160" height="78" rx="13" fill="#f1e5fa" stroke="#9170b0" stroke-width="2"/>
    <text x="1002" y="344" fill="#634185" font-size="19" font-weight="700">Message Store</text><text x="1002" y="365" fill="#765897" font-size="13">Recipient mailbox</text>
    <path d="M920 352 H665 V430 H631" fill="none" stroke="#527ca5" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="782" y="418" fill="#526479" font-size="14">POP / IMAP</text>
    <rect x="465" y="397" width="165" height="86" rx="13" fill="#deebff" stroke="#4c83b5" stroke-width="2"/>
    <text x="547" y="430" fill="#214b79" font-size="23" font-weight="700">MUA</text><text x="547" y="451" fill="#3b6085" font-size="13">Recipient client</text>
    <text x="110" y="286" fill="#526479" font-size="13">Message author</text>
    <text x="547" y="505" fill="#526479" font-size="13">Message recipient</text>
  </g>
</svg>
